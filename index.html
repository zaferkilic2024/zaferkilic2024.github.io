<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zafer Kılıç</title>
    <!-- Google Fonts üzerinden şık ve modern yazı tipleri ekledik -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* Tüm ekranlar için temel sıfırlamalar ve arka plan ayarı */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c10; /* Derin ve modern koyu gri/siyah arka plan */
            color: #c5c6c7; /* Gözü yormayan açık gri yazı rengi */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Arka plana şık ve hafif bir estetik katması için dairesel gölge efekti */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(102,252,241,0.05) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 10%;
            z-index: 1;
        }

        /* Alıntı kartının yerleşimi ve tasarımı */
        .quote-container {
            max-width: 800px;
            padding: 40px;
            text-align: center;
            z-index: 2;
            animation: fadeIn 2s ease-in-out;
        }

        /* Tırnak işareti detayı */
        .quote-icon {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            color: #1f2833; /* Arka planda hafifçe beliren tırnak rengi */
            line-height: 0;
            margin-bottom: 20px;
            display: block;
        }

        /* Esas Alıntı Sözü */
        .quote-text {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 400;
            line-height: 1.5;
            color: #ffffff; /* Sözün net okunması için saf beyaz */
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.5);
        }

        /* İmza Kısmı */
        .quote-author {
            font-size: 1.1rem;
            font-weight: 300;
            color: #66fcf1; /* İmza için dikkat çeken modern turkuaz tonu */
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            padding-top: 10px;
        }

        /* İmzanın üzerindeki şık ince çizgi */
        .quote-author::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            width: 50%;
            height: 1px;
            background-color: rgba(102, 252, 241, 0.3);
        }

        /* Sayfa ilk açıldığında yumuşakça belirme animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MOBİL UYUMLULUK (Responsive Tasarım) */
        @media (max-width: 768px) {
            .quote-container {
                padding: 20px;
                max-width: 90%;
            }

            .quote-icon {
                font-size: 3.5rem;
            }

            .quote-text {
                font-size: 1.6rem; /* Mobilde taşma yapmaması için yazı boyutunu küçülttük */
                line-height: 1.6;
            }

            .quote-author {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <div class="quote-container">
        <span class="quote-icon">“</span>
        <p class="quote-text">"Bazı eski şeyler hala yeni, bazı yeni şeyler çoktan eskidi bile..."</p>
        <div class="quote-author">Zafer</div>
    </div>

</body>
</html>
