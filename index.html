<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zafer Kılıç</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(102,252,241,0.05) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 10%;
            z-index: 1;
        }

        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
            animation: fadeIn 2s ease-in-out;
            max-width: 800px;
            padding: 20px;
        }

        .logo-wrap img {
            width: 680px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(190, 150, 70, 0.6));
        }

        .quote-icon {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: #1f2833;
            line-height: 0.6;
            display: block;
            margin-bottom: 16px;
        }

        .quote-text {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 400;
            line-height: 1.5;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 28px;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.5);
        }

        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(to right, transparent, #b8960c, transparent);
            margin: 0 auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .logo-wrap img { width: 340px; }
            .quote-text { font-size: 1.5rem; }
        }
    </style>
</head>
